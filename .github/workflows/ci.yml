name: ASEP CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Java 21)
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Build and test
        run: ./mvnw --batch-mode --no-transfer-progress clean verify

      - name: Verify private Code Delivery ledger and fake GitLab
        env:
          ASEP_VN_T13_DISPOSABLE_DB: "true"
        run: |
          docker image inspect postgres:17-alpine >/dev/null 2>&1 || docker pull postgres:17-alpine
          docker image inspect flyway/flyway:11 >/dev/null 2>&1 || docker pull flyway/flyway:11
          bash scripts/ci_verify_delivery.sh

  frontend:
    name: Frontend (Node 24)
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.11.2

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Generate Next.js types
        run: pnpm exec next typegen

      - name: Type check
        run: pnpm exec tsc --noEmit

      - name: Production build
        run: pnpm build

  orchestrator:
    name: Orchestrator (Go + PostgreSQL integration)
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    defaults:
      run:
        working-directory: orchestrator

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.3'
          cache-dependency-path: orchestrator/go.sum

      - name: Set up Java for private admission integration fixture
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Run disposable PostgreSQL/Flyway/Go verification
        env:
          ASEP_VN_T10_DISPOSABLE_DB: "true"
        run: bash scripts/ci_verify.sh
