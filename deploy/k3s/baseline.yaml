# PROPOSED. Apply after namespaces.yaml; no credentials or public Services.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: bounded-resources
  namespace: asep-pilot
spec:
  hard:
    pods: '4'
    limits.cpu: 500m
    limits.memory: 256Mi
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: asep-pilot
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-cluster-dns
  namespace: asep-pilot
spec:
  podSelector: {}
  policyTypes:
  - Egress
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: bounded-resources
  namespace: asep-apps
spec:
  hard:
    pods: '6'
    limits.cpu: '2'
    limits.memory: 2Gi
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: asep-apps
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-cluster-dns
  namespace: asep-apps
spec:
  podSelector: {}
  policyTypes:
  - Egress
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pilot
  namespace: asep-pilot
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pilot-observer
  namespace: asep-pilot
rules:
- apiGroups:
  - ''
  resources:
  - pods
  - pods/log
  - services
  - events
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - apps
  resources:
  - deployments
  - replicasets
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - networking.k8s.io
  resources:
  - networkpolicies
  verbs:
  - get
  - list
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pilot-tester
  namespace: asep-pilot
rules:
- apiGroups:
  - ''
  resources:
  - pods/exec
  verbs:
  - create
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pilot-observer
  namespace: asep-pilot
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: pilot-observer
subjects:
- apiGroup: rbac.authorization.k8s.io
  kind: Group
  name: asep-pilot-observers
- apiGroup: rbac.authorization.k8s.io
  kind: Group
  name: asep-pilot-testers
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pilot-tester
  namespace: asep-pilot
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: pilot-tester
subjects:
- apiGroup: rbac.authorization.k8s.io
  kind: Group
  name: asep-pilot-testers
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-server-from-allowed-client
  namespace: asep-pilot
spec:
  podSelector:
    matchLabels:
      app: pilot-server
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: pilot-client
          access: allowed
    ports:
    - protocol: TCP
      port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-client-to-server
  namespace: asep-pilot
spec:
  podSelector:
    matchLabels:
      app: pilot-client
      access: allowed
  policyTypes:
  - Egress
  egress:
  - to:
    - podSelector:
        matchLabels:
          app: pilot-server
    ports:
    - protocol: TCP
      port: 8080
