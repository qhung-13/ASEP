# Install as /etc/systemd/system/k3s.service.d/20-asep-firewall.conf
# Append to vendor pre-start commands; never reset the existing ExecStartPre.
[Unit]
BindsTo=asep-k3s-firewall.service
After=asep-k3s-firewall.service network-online.target

[Service]
ExecStartPre=/usr/local/libexec/asep-k3s-firewall check
