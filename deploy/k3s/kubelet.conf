# K3s >= 1.32 recommended drop-in location:
# /var/lib/rancher/k3s/agent/etc/kubelet.conf.d/99-asep.conf
# Do not replace the generated 00-k3s-defaults.conf or turn off host swap.
apiVersion: kubelet.config.k8s.io/v1beta1
kind: KubeletConfiguration
failSwapOn: false
memorySwap:
  swapBehavior: NoSwap
